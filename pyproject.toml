[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "timememory"
version = "0.7.0"
description = "TimeMemorySystem: 为老人书写人生回忆录的多智能体系统（访谈→成书→审核→记忆库全链路）"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "langgraph>=1.0",
    "langchain-core>=1.0",
    "langchain-openai>=1.0",
    "pydantic>=2.0",
    "pymysql>=1.1",
]

[tool.setuptools.packages.find]
where = ["src"]
